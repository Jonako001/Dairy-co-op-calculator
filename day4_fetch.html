<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Country Info</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #1F4E79; }
    #result { background: #f7f9fc; border: 1px solid #d0dff0; border-radius: 8px; padding: 20px; margin-top: 20px; }
    button { background: #2E75B6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    .ok { color: green; font-size: 12px; margin-top:10px; }
  </style>
</head>
<body>
<h1>Country Info</h1>
<input type="text" id="countryInput" placeholder="Enter a country name" value="kenya" style="padding:8px; font-size:16px; width:250px;">
<button onclick="loadCountry()">Search</button>
<div id="result">Enter a country name above and click Search.</div>
<script>
const OFFLINE_DATA = {
  kenya: { name: "Kenya", capital: "Nairobi", region: "Africa", population: "54,985,698", flag: "🇰🇪" },
  nigeria: { name: "Nigeria", capital: "Abuja", region: "Africa", population: "223,800,000", flag: "🇳🇬" },
  ghana: { name: "Ghana", capital: "Accra", region: "Africa", population: "34,121,985", flag: "🇬🇭" },
  usa: { name: "United States", capital: "Washington, D.C.", region: "Americas", population: "340,000,000", flag: "🇺🇸" },
  japan: { name: "Japan", capital: "Tokyo", region: "Asia", population: "124,000,000", flag: "🇯🇵" }
};

async function loadCountry() {
  const countryRaw = document.getElementById("countryInput").value.trim();
  const country = countryRaw.toLowerCase();
  if (!country) return document.getElementById("result").innerHTML = "Please enter a country name.";
  
  document.getElementById("result").innerHTML = "Loading...";
  await new Promise(r => setTimeout(r, 600)); // show loading state

  try {
    const url = `https://restcountries.com/v3.1/name/${country}?fields=name,capital,population,region,flags`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("API failed");
    const data = await res.json();
    const info = data[0];
    document.getElementById("result").innerHTML = `
      <h2>${info.flags?.emoji || '🌍'} ${info.name.common}</h2>
      <p><strong>Capital:</strong> ${info.capital?.[0] || 'N/A'}</p>
      <p><strong>Region:</strong> ${info.region}</p>
      <p><strong>Population:</strong> ${info.population.toLocaleString()}</p>
      <div class="ok">✅ Live from restcountries.com API</div>
    `;
  } catch (e) {
    // OFFLINE FALLBACK - still shows data, never breaks
    const local = OFFLINE_DATA[country];
    if (local) {
      document.getElementById("result").innerHTML = `
        <h2>${local.flag} ${local.name}</h2>
        <p><strong>Capital:</strong> ${local.capital}</p>
        <p><strong>Region:</strong> ${local.region}</p>
        <p><strong>Population:</strong> ${local.population}</p>
        <div class="ok">⚠️ Showing offline demo data (Live API blocked by network, but loading/error states work)</div>
      `;
    } else {
      document.getElementById("result").innerHTML = `Error: Country not found (${countryRaw}). Try kenya, nigeria, ghana, usa, japan.`;
    }
  }
}
loadCountry(); // auto-load kenya on open
</script>
</body>
</html>
